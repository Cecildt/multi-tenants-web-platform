name = "tenants-admin-web-platform"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-01-19"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB"
database_name = "tenants-db"
# Replace with the real Cloudflare D1 database_id after `wrangler d1 create tenants-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../tenants-db-lib/migrations"

# D1 bindings are not inherited into named environments.
[[env.development.d1_databases]]
binding = "DB"
database_name = "tenants-db"
# Replace with the real Cloudflare D1 database_id after `wrangler d1 create tenants-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../tenants-db-lib/migrations"

[env.development.vars]
NODE_VERSION = "22.13.0"

# D1 bindings are not inherited into named environments.
[[env.production.d1_databases]]
binding = "DB"
database_name = "tenants-db"
# Replace with the real Cloudflare D1 database_id after `wrangler d1 create tenants-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../tenants-db-lib/migrations"

[env.production.vars]
NODE_VERSION = "22.13.0"