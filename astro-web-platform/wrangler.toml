name = "tenants-admin-web-platform"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-01-19"
compatibility_flags = [ "nodejs_compat" ]

# Bindings are not inherited by env blocks; repeat them in each env below.
[[services]]
binding = "TENANTS_API"
service = "tenants-graphql-api"

# Development environment
# Bindings must be re-declared here because they are not inherited from the top level.
[env.development.vars]
NODE_VERSION = "22.13.0"

[[env.development.services]]
binding = "TENANTS_API"
service = "tenants-graphql-api"

# Production environment
# Bindings must be re-declared here because they are not inherited from the top level.
[env.production.vars]
NODE_VERSION = "22.13.0"

[[env.production.services]]
binding = "TENANTS_API"
service = "tenants-graphql-api"